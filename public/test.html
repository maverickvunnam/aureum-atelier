<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
</head>
<body>
  <h1>API Testing Page</h1>
  
  <div>
    <button id="testButton">Test Simple Fetch</button>
    <div id="result" style="margin-top: 20px; padding: 10px;"></div>
  </div>

  <script>
    document.getElementById('testButton').addEventListener('click', function() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Testing...';
      resultDiv.style.background = '#f5f5f5';
      
      // Try to fetch a static JSON file
      fetch('/test-data.json')
        .then(response => {
          resultDiv.innerHTML += `<br>Response status: ${response.status}`;
          return response.json();
        })
        .then(data => {
          resultDiv.style.background = '#e6ffe6';
          resultDiv.innerHTML += '<br><br>Success! Data received:';
          resultDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        })
        .catch(error => {
          resultDiv.style.background = '#ffe6e6';
          resultDiv.innerHTML += `<br><br>Error: ${error.message}`;
        });
    });
  </script>
</body>
</html>
